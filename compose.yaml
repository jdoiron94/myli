# myli with Docker Compose: Caddy serving the app over HTTPS, the API, and Meilisearch. See the
# README's "Getting started".
#
# Settings come from the environment, or from .env next to this file (.env.example lists them).
# PUBLIC_URL, BETTER_AUTH_SECRET and MEILI_MASTER_KEY are required. ADMIN_PASSWORD, SMTP_PASSWORD
# and S3_SECRET_ACCESS_KEY must be listed even when unused, empty if so: every secret goes to the
# containers as a file, and Compose refuses to start when a secret's variable isn't there at all.
#
# Images come from MYLI_IMAGE_PREFIX (a registry, like ghcr.io/jdoiron94/ for releases) at MYLI_VERSION.
# Without them, Compose builds them here from the repo: `docker compose up --build`.

name: myli

# Every service: no Linux capabilities and no way to gain any, and restarted unless stopped.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  caddy:
    <<: *hardened
    image: ${MYLI_IMAGE_PREFIX:-}myli-web:${MYLI_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Caddy writes only to /data (apps/web/Caddyfile).
    read_only: true
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?must be set to the address people open myli at, like https://myli.home.arpa}
    # HTTPS on PUBLIC_URL's port (TCP, and UDP for HTTP/3), and HTTP, which only redirects to it.
    # Caddy listens on PUBLIC_URL's port inside the container too, so MYLI_HTTPS_PORT must match it.
    ports:
      - ${MYLI_HTTP_PORT:-80}:80
      - ${MYLI_HTTPS_PORT:-443}:${MYLI_HTTPS_PORT:-443}/tcp
      - ${MYLI_HTTPS_PORT:-443}:${MYLI_HTTPS_PORT:-443}/udp
    volumes:
      # The local CA, whose root every device trusts, and the certificates (ADR 0013). Back it up:
      # losing it means trusting a new root on every device.
      - caddy-data:/data
    networks: [proxy]
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardened
    image: ${MYLI_IMAGE_PREFIX:-}myli-api:${MYLI_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Not read_only: Compose copies secrets from the environment into the container, which it can't
    # do in a read-only one.
    # The image sets NODE_ENV, HOST, PORT, DATABASE_PATH, BLOB_DIR and BACKUP_DIR
    # (apps/api/Dockerfile). An empty value counts as unset, so the API's defaults apply.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?must be set to the address people open myli at, like https://myli.home.arpa}
      # Each secret is a file in /run/secrets (see `secrets` below), named only when it's set. Unset,
      # the API's own error says what's missing.
      BETTER_AUTH_SECRET_FILE: ${BETTER_AUTH_SECRET:+/run/secrets/better_auth_secret}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY_FILE: ${MEILI_MASTER_KEY:+/run/secrets/meili_master_key}
      # Caddy is the API's only way in, and only Caddy and the API are on the proxy network.
      TRUSTED_PROXIES: ${MYLI_PROXY_SUBNET:-10.89.0.0/29}
      LOG_LEVEL: ${LOG_LEVEL:-}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD:+/run/secrets/admin_password}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD:+/run/secrets/smtp_password}
      SMTP_FROM: ${SMTP_FROM:-}
      BLOB_STORE: ${BLOB_STORE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY_FILE: ${S3_SECRET_ACCESS_KEY:+/run/secrets/s3_secret_access_key}
    secrets:
      [better_auth_secret, meili_master_key, admin_password, smtp_password, s3_secret_access_key]
    volumes:
      # The database, and the photos unless they're kept in S3: all of the instance's data.
      - api-data:/data
      # The nightly backups, of both. To keep them on another disk, mount a directory there instead
      # (the README's "Back up and restore").
      - backups:/backups
    networks: [proxy, backend]
    depends_on:
      # The API starts without search, and keeps trying to reach it.
      meilisearch:
        condition: service_started
      # With the s3 profile, only once Garage is ready for photos.
      garage-init:
        condition: service_completed_successfully
        required: false

  meilisearch:
    <<: *hardened
    image: getmeili/meilisearch:v1.56.1@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    # Meilisearch reads its master key only from its environment or a config file, so this reads
    # the secret into its environment as it starts. The image runs it as root, under tini.
    entrypoint: [tini, --, sh, -c]
    command: [MEILI_MASTER_KEY="$$(cat /run/secrets/meili_master_key)" exec /bin/meilisearch]
    secrets: [meili_master_key]
    volumes:
      # The search index, rebuilt from the database when needed: no need to back it up.
      - meilisearch-data:/meili_data
    networks: [backend]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:7700/health]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  # Optional (`docker compose --profile s3 up`): Garage, a store that speaks S3, for photos, on this
  # machine. Set BLOB_STORE=s3, the S3_* variables and Garage's secrets as the README's "Keep photos
  # in S3" shows. Only the API can reach it, on the backend network.
  garage:
    <<: *hardened
    profiles: [s3]
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    # Not read_only: Compose copies the secrets into the container. The image runs Garage as root,
    # and Garage refuses secrets anyone else could read, so only root may.
    environment:
      GARAGE_RPC_SECRET_FILE: ${MYLI_GARAGE_RPC_SECRET:+/run/secrets/myli_garage_rpc_secret}
      GARAGE_ADMIN_TOKEN_FILE: ${MYLI_GARAGE_ADMIN_TOKEN:+/run/secrets/myli_garage_admin_token}
    secrets:
      - source: myli_garage_rpc_secret
        mode: 0400
      - source: myli_garage_admin_token
        mode: 0400
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      # Its photos and what it knows of them. Back it up with the database.
      - garage-data:/var/lib/garage
    networks: [backend]
    healthcheck:
      test: [CMD, /garage, status]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  # With the s3 profile: sets Garage up for the API, then exits, before the API starts. Each time,
  # it leaves what's done as it is (apps/api/src/set-up-garage.ts).
  garage-init:
    <<: *hardened
    profiles: [s3]
    image: ${MYLI_IMAGE_PREFIX:-}myli-api:${MYLI_VERSION:-latest}
    # The api service's image, which that service pulls or builds.
    pull_policy: never
    command: [node, src/set-up-garage.ts]
    # Once each time the stack starts: Garage keeps what it sets up.
    restart: 'no'
    healthcheck:
      disable: true
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN_FILE: ${MYLI_GARAGE_ADMIN_TOKEN:+/run/secrets/myli_garage_admin_token}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY_FILE: ${S3_SECRET_ACCESS_KEY:+/run/secrets/s3_secret_access_key}
      LOG_LEVEL: ${LOG_LEVEL:-}
    secrets: [myli_garage_admin_token, s3_secret_access_key]
    networks: [backend]
    depends_on:
      garage:
        condition: service_healthy

  # Development only (`docker compose --profile dev up`): catches the API's email, with
  # SMTP_HOST=mailpit, SMTP_SECURITY=none and any SMTP_FROM. Its inbox is at http://localhost:8025,
  # and an API run on this machine (`pnpm dev`) can send to localhost:1025.
  mailpit:
    <<: *hardened
    profiles: [dev]
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp]
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025
    networks: [backend]

networks:
  # Caddy and the API. The API believes what's said in X-Forwarded-For only when it comes from this
  # subnet. Change MYLI_PROXY_SUBNET if it clashes with a network on the host.
  proxy:
    ipam:
      config:
        - subnet: ${MYLI_PROXY_SUBNET:-10.89.0.0/29}
  # The API and Meilisearch, which Caddy can't reach.
  backend:

volumes:
  api-data:
  backups:
  caddy-data:
  meilisearch-data:
  garage-data:

configs:
  # Garage's settings, in the s3 profile. Its secrets come from files (`garage` above).
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      # One node, so one copy of each photo.
      replication_factor = 1
      # Where nodes talk to each other. Alone, it talks only to itself.
      rpc_bind_addr = "127.0.0.1:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      api_bind_addr = "[::]:3900"
      # The region requests are signed for: the API's S3_REGION, unless it's changed.
      s3_region = "us-east-1"

      [admin]
      api_bind_addr = "[::]:3903"

# Each from the variable of the same name. Compose 5 doesn't mount an empty one, and older versions
# mount an empty file. Either way, the API's NAME_FILE is empty then, so it doesn't read it.
secrets:
  better_auth_secret:
    environment: BETTER_AUTH_SECRET
  meili_master_key:
    environment: MEILI_MASTER_KEY
  admin_password:
    environment: ADMIN_PASSWORD
  smtp_password:
    environment: SMTP_PASSWORD
  s3_secret_access_key:
    environment: S3_SECRET_ACCESS_KEY
  myli_garage_rpc_secret:
    environment: MYLI_GARAGE_RPC_SECRET
  myli_garage_admin_token:
    environment: MYLI_GARAGE_ADMIN_TOKEN
