packages:
  - apps/*
  - packages/*
  # Playwright's end-to-end tests. Outside apps/*, so Vitest's projects don't pick up its specs.
  - e2e

# Versions shared by more than one workspace package. Reference them as "catalog:".
catalog:
  '@types/node': 26.6.6
  # The API's server and the web app's client must be the same release.
  better-auth: 1.7.23
  # Runs containers for the API's tests and the end-to-end tests against the images.
  testcontainers: 12.2.1
  # TypeScript 7 (the native compiler) ships no JS API, which vue-tsc and
  # typescript-eslint both depend on. Stay on 6.x until they support 7.
  typescript: 6.0.3
  # Required peer dependency of Vitest.
  vite: 8.3.8
  vitest: 5.1.0
  # Upgrade together with @hono/zod-openapi (ADR 0001).
  zod: 4.6.7

# Dependencies allowed to run install scripts. pnpm blocks all others.
allowBuilds:
  # Its postinstall runs `lefthook install` to set up the git hooks (skipped when CI is set).
  lefthook: true
  # (drizzle-kit) Its postinstall only re-checks the platform binary, which pnpm already
  # installs as an optional dependency.
  esbuild: false
  # (@tanstack/vue-query) Its postinstall picks the Vue 2 or Vue 3 build. The files it ships are
  # already the Vue 3 build.
  vue-demi: false
  # (testcontainers, through dockerode) Builds optional native code for Docker over SSH, which
  # isn't used: Testcontainers reaches Docker through its local socket. ssh2 falls back to plain
  # JavaScript without its binding, and cpu-features only serves that binding.
  ssh2: false
  cpu-features: false
  # (testcontainers, through gRPC) Its postinstall only warns about how a parent package writes
  # its version range.
  protobufjs: false

# Peer ranges that are knowingly wider than a package declares.
peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7 asks for TypeScript 5, and works with 6: it only uses the compiler API to
    # print type declarations, which vue-tsc then checks along with every call site.
    openapi-typescript>typescript: '6'

# Refuse to install on a Node version outside "engines" in package.json.
engineStrict: true
# Pin exact versions when adding dependencies.
saveExact: true
