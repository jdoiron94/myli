# The checks that run locally (CLAUDE.md, "Commands"), on each pull request to main: when it's
# opened, and on every push to it. Not again once it's merged, since main then holds what it
# checked, and not on release-please's pull requests, which change only the changelog and the
# version. Anything else can be checked by hand, from the Actions tab.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The token can read the repository and nothing else.
permissions:
  contents: read # checking out

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request cancels its run in progress.
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck and unit tests
    # Each job skips release-please's pull requests (see the top).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the checks that the OpenAPI document, the web app's API types and the
      # migrations match the code.
      - run: pnpm test
      # Advisories never fail CI. They're listed in the run's summary, with a warning.
      - name: Report known vulnerabilities
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          pnpm audit > "$RUNNER_TEMP/audit.txt" 2>&1
          status=$?
          set -e
          verdict=$(tail -n 2 "$RUNNER_TEMP/audit.txt" | paste -sd ' ')
          {
            echo '### pnpm audit'
            echo
            echo "<details><summary>$verdict</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=pnpm audit::$verdict See the run's summary."
          fi

  e2e:
    name: End-to-end tests against the dev servers
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test:e2e
      - name: Keep the failed tests' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dev-servers
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container tests and end-to-end tests against the Compose stack
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          playwright: 'true'
      # Builds the images, so it needs no registry.
      - run: pnpm test:containers
      - name: Keep the failed tests' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose-stack
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
